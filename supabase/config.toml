# Supabase CLI settings. Only the CLI reads this file, and the app does not use a
# CLI dev stack: the local and production databases run from deploy/ (see
# docs/MEMORY.md). Anything not set here takes the CLI default.
project_id = "bj"

[db]
# Matches the supabase/postgres image in deploy/docker-compose.yml.
major_version = 15

# Puts the caller's roles into the JWT (migration 20260702150001).
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"
