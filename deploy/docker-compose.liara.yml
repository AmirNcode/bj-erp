# Explicit Liara override; never used by the existing client-server target.
services:
  db:
    platform: linux/amd64
  auth:
    platform: linux/amd64
  rest:
    platform: linux/amd64
  app:
    platform: linux/amd64
  gateway:
    platform: linux/amd64
    image: caddy:2.11.4-alpine
    ports: !override
      - '80:80'
      - '443:443'
    environment:
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    volumes:
      - ./liara/Caddyfile:/etc/caddy/Caddyfile:ro
