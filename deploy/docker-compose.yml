# =============================================================================
# deploy/docker-compose.yml — BJ ERP self-host stack (one server, no internet).
#
# Services:
#   db       Supabase Postgres (schemas, roles, extensions preinstalled)
#   auth     GoTrue — issues/refreshes login tokens (JWT, HS256 shared secret)
#   rest     PostgREST — the data API the app talks to (RLS enforced here)
#   app      the Next.js app (standalone build, placeholder-substituted)
#   gateway  Caddy — HTTPS (self-signed internal CA) + routes /auth/v1 and
#            /rest/v1 to the right service; also a plain-HTTP :8080 listener
#            for the app container's own server-side calls
#
# All config comes from .env (generated by install.sh). Versions are pinned —
# they are tested together; never bump one service alone (the app writes
# auth.users rows directly, so the auth image version matters).
#
# Two host settings, and they are NOT interchangeable:
#   APP_HOST    bare hostname/IP only, no port — the TLS certificate's name and
#               the Caddy site address. Caddy always listens on 443 INSIDE the
#               container; APP_PORT only changes what the host publishes.
#   APP_ORIGIN  the full URL employees type, e.g. https://10.10.10.50:3500.
#               Every public URL below must use it — it is baked into the
#               browser bundle, so if it omits a non-standard port the browser
#               calls :443, nothing answers, and login fails.
# =============================================================================

name: bj-erp

services:
  db:
    image: supabase/postgres:15.8.1.085
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Single-file mount with a zz- name: the supabase/postgres image ships its
      # own init scripts in this directory (roles, schemas) — never mount OVER
      # the directory, only add to it, and run after theirs.
      - ./sql/init/00-init.sh:/docker-entrypoint-initdb.d/zz-bj-init.sh:ro
      - ./migrations:/bj/migrations:ro
      - ./sql/seed.sql:/bj/seed.sql:ro
      - ./sql/bootstrap_admin.sql:/bj/bootstrap_admin.sql:ro
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'supabase_admin', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    image: supabase/gotrue:v2.170.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: '9999'
      API_EXTERNAL_URL: ${APP_ORIGIN:?set APP_ORIGIN in .env — re-run ./install.sh once}

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres

      GOTRUE_SITE_URL: ${APP_ORIGIN:?set APP_ORIGIN in .env — re-run ./install.sh once}
      GOTRUE_URI_ALLOW_LIST: ${APP_ORIGIN:?set APP_ORIGIN in .env — re-run ./install.sh once}/*

      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: '3600'
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role

      # Accounts are created only by the admin, in-database — no self-signup,
      # no email delivery (logins are synthetic code@bj-app.internal addresses).
      GOTRUE_DISABLE_SIGNUP: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
      GOTRUE_SMTP_ADMIN_EMAIL: noreply@bj-app.internal

      # Roles ride in the JWT (app_roles claim) — same hook as the demo.
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_ENABLED: 'true'
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_URI: pg-functions://postgres/public/custom_access_token_hook

      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: 'true'
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: '10'

  rest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: 'false'
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: '3600'

  app:
    image: bj-erp-app:${APP_VERSION:-latest}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - auth
      - rest
    environment:
      # Public URL — inlined into the browser bundle at first boot. MUST carry
      # the published port when it is not 443; the browser calls this verbatim.
      # Changing it needs a container RECREATE, not a restart:
      #   docker compose up -d --force-recreate app
      NEXT_PUBLIC_SUPABASE_URL: ${APP_ORIGIN:?set APP_ORIGIN in .env — re-run ./install.sh once}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      # Internal URL for the app's own server-side calls (plain HTTP — the
      # public cert is a private CA this container doesn't trust).
      SUPABASE_URL: http://gateway:8080

  gateway:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      # Only HTTPS is published. Caddy's listener stays on 443 inside the
      # container whatever APP_PORT is — do not change the right-hand side.
      # Port 80 is deliberately not published (IT policy), so there is no
      # http:// -> https:// redirect: employees must use the full APP_ORIGIN.
      - '${APP_PORT:-443}:443'
    environment:
      APP_HOST: ${APP_HOST}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
