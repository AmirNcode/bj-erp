<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2E3C92">
  <title>اتصال برقرار نیست · No connection</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #F7F8FB; color: #1f2937; padding: 24px;
      font-family: Vazirmatn, Tahoma, "Segoe UI", system-ui, sans-serif;
    }
    main {
      width: 100%; max-width: 360px; text-align: center; background: #fff;
      border: 1px solid #e5e7eb; border-radius: 8px; padding: 32px 24px;
    }
    img { width: 160px; height: auto; margin-bottom: 20px; }
    h1 { font-size: 18px; margin: 0 0 6px; }
    p { margin: 0 0 4px; color: #4b5563; font-size: 14px; }
    p[lang="en"] { direction: ltr; }
    a {
      display: inline-block; margin-top: 20px; padding: 10px 20px; border-radius: 6px;
      background: #2E3C92; color: #fff; text-decoration: none; font-weight: 600; font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <img src="/bj-logo.png" alt="">
    <h1>اتصال به اینترنت برقرار نیست</h1>
    <p>لطفاً اتصال خود را بررسی کنید و دوباره تلاش کنید.</p>
    <p lang="en">No internet connection. Check your connection and try again.</p>
    <a href="/">تلاش دوباره · Try again</a>
  </main>
</body>
</html>
