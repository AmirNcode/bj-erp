name: Deploy Liara
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: liara-main
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/audit-gate.mjs
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:deploy
      - name: Build committed Linux release
        run: bash deploy/liara/package-release.sh "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: liara-release
          path: .bj-deploy/liara/artifacts/${{ github.sha }}/release.*
          include-hidden-files: true
          retention-days: 3
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.LIARA_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: liara
      url: https://bjeng.app
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: liara-release
      - name: Transfer and apply release
        env:
          LIARA_SSH_KEY: ${{ secrets.LIARA_SSH_KEY }}
          LIARA_KNOWN_HOSTS: ${{ secrets.LIARA_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$LIARA_SSH_KEY" > ~/.ssh/liara
          printf '%s\n' "$LIARA_KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/liara' EXIT
          sha256sum --check release.sha256
          SSH_ARGS=(-i ~/.ssh/liara -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=30)
          scp -P 32222 "${SSH_ARGS[@]}" release.tar "bj-deploy@62.60.191.132:/var/lib/bj-deploy/incoming/$GITHUB_SHA.tar"
          scp -P 32222 "${SSH_ARGS[@]}" release.sha256 "bj-deploy@62.60.191.132:/var/lib/bj-deploy/incoming/$GITHUB_SHA.sha256"
          ssh -p 32222 "${SSH_ARGS[@]}" bj-deploy@62.60.191.132 "sudo -n /usr/local/sbin/bj-liara-apply $GITHUB_SHA"
          curl --fail --retry 3 --max-time 20 https://bjeng.app/api/health
