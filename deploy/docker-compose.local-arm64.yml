# Native Apple-Silicon development overlay.
#
# Use this only on an ARM64 Mac, together with the production-shaped base file:
#   docker compose -f deploy/docker-compose.yml \
#     -f deploy/docker-compose.local-arm64.yml up -d
#
# The dedicated local tags are intentional. deploy/package.sh and
# deploy/release.sh build/pull linux/amd64 artifacts for the client's server;
# those operations must never replace the images used by this local stack.
services:
  db:
    image: supabase/postgres:15.8.1.085-local-arm64
    platform: linux/arm64
    ports:
      - '127.0.0.1:5433:5432'

  auth:
    image: supabase/gotrue:v2.170.0-local-arm64
    platform: linux/arm64

  rest:
    image: postgrest/postgrest:v12.2.3-local-arm64
    platform: linux/arm64

  app:
    image: bj-erp-app:local-arm64
    platform: linux/arm64

  gateway:
    image: caddy:2.8.4-alpine-local-arm64
    platform: linux/arm64
    ports:
      # Publishes Caddy's plain-HTTP :8080 listener (deploy/caddy/Caddyfile) so
      # `npm run dev` on this Mac can reach Auth + PostgREST. The dev server is
      # http://localhost:3000 while the stack's own site is HTTPS with a private
      # CA, so the browser cannot use the 443 site: it would need to trust the CA
      # AND the :8080 block is the only one that answers GoTrue's CORS preflight
      # (GoTrue sends none of its own; on Supabase Cloud that is Kong's job).
      #
      # Bound to 127.0.0.1 deliberately. This listener is plain HTTP and replies
      # `Access-Control-Allow-Origin: *` to preflights, so it must not be offered
      # to the LAN. Loopback also makes it immune to the Mac's DHCP lease moving,
      # which has broken .env.local twice. To drive `next dev` from a phone on the
      # LAN you would need '0.0.0.0:8080:8080' here plus the Mac's current IP in
      # .env.local and next.config.ts allowedDevOrigins — accepting that auth
      # tokens then cross the network in the clear. Testing the phone against the
      # built container on APP_ORIGIN (HTTPS) is the better path.
      #
      # Never add this to docker-compose.yml: on the client's server the port is
      # unpublished, which is what keeps the listener inert in production.
      - '127.0.0.1:8080:8080'
