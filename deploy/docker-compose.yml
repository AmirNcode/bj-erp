# =============================================================================
# deploy/docker-compose.yml — BJ ERP self-host stack (one server, no internet).
#
# Services:
#   db       Supabase Postgres (schemas, roles, extensions preinstalled)
#   auth     GoTrue — issues/refreshes login tokens (JWT, HS256 shared secret)
#   rest     PostgREST — the data API the app talks to (RLS enforced here)
#   app      the Next.js app (standalone build, placeholder-substituted)
#   gateway  Caddy — HTTPS (self-signed internal CA) + routes /auth/v1 and
#            /rest/v1 to the right service; also a plain-HTTP :8080 listener
#            for the app container's own server-side calls
#
# All config comes from .env (generated by install.sh). Versions are pinned —
# they are tested together; never bump one service alone (the app writes
# auth.users rows directly, so the auth image version matters).
# =============================================================================

name: bj-erp

services:
  db:
    image: supabase/postgres:15.8.1.085
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Single-file mount with a zz- name: the supabase/postgres image ships its
      # own init scripts in this directory (roles, schemas) — never mount OVER
      # the directory, only add to it, and run after theirs.
      - ./sql/init/00-init.sh:/docker-entrypoint-initdb.d/zz-bj-init.sh:ro
      - ./migrations:/bj/migrations:ro
      - ./sql/seed.sql:/bj/seed.sql:ro
      - ./sql/bootstrap_admin.sql:/bj/bootstrap_admin.sql:ro
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'supabase_admin', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    image: supabase/gotrue:v2.170.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: '9999'
      API_EXTERNAL_URL: https://${APP_HOST}

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres

      GOTRUE_SITE_URL: https://${APP_HOST}
      GOTRUE_URI_ALLOW_LIST: https://${APP_HOST}/*

      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: '3600'
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role

      # Accounts are created only by the admin, in-database — no self-signup,
      # no email delivery (logins are synthetic code@bj-app.internal addresses).
      GOTRUE_DISABLE_SIGNUP: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
      GOTRUE_SMTP_ADMIN_EMAIL: noreply@bj-app.internal

      # Roles ride in the JWT (app_roles claim) — same hook as the demo.
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_ENABLED: 'true'
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_URI: pg-functions://postgres/public/custom_access_token_hook

      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: 'true'
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: '10'

  rest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: 'false'
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: '3600'

  app:
    image: bj-erp-app:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - auth
      - rest
    environment:
      # Public URL — inlined into the browser bundle at first boot.
      NEXT_PUBLIC_SUPABASE_URL: https://${APP_HOST}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      # Internal URL for the app's own server-side calls (plain HTTP — the
      # public cert is a private CA this container doesn't trust).
      SUPABASE_URL: http://gateway:8080

  gateway:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    environment:
      APP_HOST: ${APP_HOST}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
